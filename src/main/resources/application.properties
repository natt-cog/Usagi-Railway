# ============================================================
#  うさぎ鉄道 電力・車両保守システム (URMS)  application.properties
#  (本番は 指令所サーバ urms-ap01/02 の Tomcat 8.5 + JNDI DataSource. ここは開発/検証用)
# ============================================================
spring.application.name=usagi-railway
server.port=8080
server.context-path=/urms
server.session.timeout=3600
server.tomcat.uri-encoding=UTF-8

spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# --- View (JSP) ---
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp
spring.mvc.date-format=yyyy/MM/dd
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.resources.cache-period=3600

# --- DataSource (Oracle 互換モード H2) ---
# 本番: jdbc:oracle:thin:@//urms-db01:1521/URMSPRD
spring.datasource.url=jdbc:h2:mem:urms;MODE=Oracle;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=URMS
spring.datasource.password=urms
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.tomcat.max-active=20
spring.datasource.tomcat.test-on-borrow=true
spring.datasource.tomcat.validation-query=SELECT 1 FROM DUAL

# 本番は Oracle 11g R2 (Oracle10gDialect). ローカル/検証は H2 Oracle 互換モードのため H2Dialect を使用
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Tokyo
spring.jpa.open-in-view=true

flyway.enabled=true
flyway.locations=classpath:db/migration
flyway.baseline-on-migrate=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Cache (Ehcache 2) ---
spring.cache.type=ehcache
spring.cache.ehcache.config=classpath:ehcache.xml

# --- Security ---
security.basic.enabled=false
security.sessions=if_required

# --- Actuator ---
management.context-path=/manage
management.security.enabled=false
endpoints.health.sensitive=false
endpoints.info.enabled=true
endpoints.metrics.enabled=true
endpoints.shutdown.enabled=false
info.app.name=${spring.application.name}
info.app.version=@project.version@

# --- 業務パラメータ ---
# 検証環境は運用日を固定する (本番は空 = システム日付)
urms.operation-date=2026/10/05
# 警報判定閾値 (直流 1500V き電. 全変電所共通)
#   ※ batch/c/urpwd01.c の UV_THRESHOLD / OC_THRESHOLD と同じ値にすること
urms.alarm.undervoltage-v=1400
urms.alarm.overcurrent-a=3800
# 検査期限 接近判定 (日)
urms.inspection.warn-days=14

# --- Logging ---
logging.level.root=INFO
logging.level.jp.usagi.railway=DEBUG
logging.level.AUDIT=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy/MM/dd HH:mm:ss.SSS} %5p [%t] %-40.40logger{39} : %m%n

# JSON 日時書式 (指令所端末 / 事業者連携 API 共通)
spring.jackson.date-format=yyyy/MM/dd HH:mm:ss
spring.jackson.time-zone=Asia/Tokyo
